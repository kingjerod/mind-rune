[package]
name = "mindrune"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
mr-agent = { path = "../agent" }
mr-core = { path = "../core" }
mr-claude = { path = "../claude" }
rune = { git = "https://github.com/anomalyco/rune", rev = "2a44156b21d63b0342a366b26d9222a6edd4622c", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "2a44156b21d63b0342a366b26d9222a6edd4622c", features = ["markdown"] }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "2a44156b21d63b0342a366b26d9222a6edd4622c" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Desktop notifications over the session bus (`notify`), as Rune's own tray worker talks to it.
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }
zbus = { version = "6", default-features = false, features = ["tokio"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile.workspace = true
